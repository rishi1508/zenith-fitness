ext {
    // Health Connect requires Android 8.0 / API 26 (@capgo/capacitor-health).
    minSdkVersion = 26
    // One Kotlin plugin version for the whole build. @capgo/capacitor-health
    // hard-pins 2.4.10; @capacitor/camera honours this property and would
    // otherwise load 2.2.20 in its own subproject, and Gradle warns that a
    // Kotlin plugin loaded twice at different versions may break the build.
    kotlin_version = '2.4.10'
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}