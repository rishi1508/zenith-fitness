name: Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        env:
          # Baked into the Vite bundle at build time. Both are required
          # for push notifications:
          #   - VAPID key is the public half of the Web Push keypair
          #   - PUSH_ENDPOINT is the Vercel /api/push URL that sends FCM
          VITE_FCM_VAPID_KEY: ${{ secrets.VITE_FCM_VAPID_KEY }}
          VITE_PUSH_ENDPOINT: ${{ secrets.VITE_PUSH_ENDPOINT }}
        run: npm run build

      # ---- Firebase Hosting + Firestore rules Deploy ----
      - name: Deploy to Firebase (Hosting + Firestore rules)
        run: npx firebase-tools deploy --only hosting,firestore:rules --token "$FIREBASE_TOKEN"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      # ---- Android APK Build ----
      # The APK build is the user-visible deliverable, so it MUST run
      # before the Cloud Functions deploy below. Earlier we ran the
      # function deploy here and a config-level failure (no functions
      # target in firebase.json) blocked the entire pipeline — no APK
      # got produced for that tag.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/zenith-fitness.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/zenith-fitness.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # Play Console takes an Android App Bundle, signed with the same upload
      # key; Google re-signs it with the Play app-signing key on their side.
      - name: Build Release AAB (Play Store)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/zenith-fitness.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Rename APK and AAB
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/release/app-release.apk zenith-fitness-v${VERSION}.apk
          mv android/app/build/outputs/bundle/release/app-release.aab zenith-fitness-v${VERSION}.aab

      - name: Upload APK and AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenith-fitness-android
          path: |
            zenith-fitness-*.apk
            zenith-fitness-*.aab

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            zenith-fitness-*.apk
            zenith-fitness-*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Cloud Functions Deploy ----
      # Runs LAST, so a function-side failure (auth / rules / wrong
      # secret) can never block the APK release above. Uses the
      # predeploy hook in firebase.json to build the function source.
      # `continue-on-error: true` means the GitHub Actions run is
      # marked successful even if this step fails — the APK is still
      # delivered. Inspect the step log if a deploy goes red.
      - name: Install Cloud Functions deps
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: functions
        run: npm ci
        continue-on-error: true

      - name: Deploy Cloud Functions
        if: startsWith(github.ref, 'refs/tags/')
        run: npx firebase-tools deploy --only functions --token "$FIREBASE_TOKEN" --force --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        continue-on-error: true
